name: Build MacHost IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Hiermee kun je handmatig op 'Run workflow' klikken in GitHub

jobs:
  build:
    name: Build & Package MacHost.ipa
    runs-on: macos-14 # Apple Silicon (M1/M2) runner met actuele Xcode & iOS SDK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path
          clang --version

      - name: Install Signing Tools (ldid)
        run: |
          brew install ldid || true

      - name: Run Verification Test Suite
        run: |
          python3 tests/verify_all.py

      - name: Compile and Package MacHost IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify IPA Contents
        run: |
          ls -lh build/MacHost.ipa
          unzip -l build/MacHost.ipa

      - name: Upload MacHost.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacHost-ipa
          path: build/MacHost.ipa
          retention-days: 14
